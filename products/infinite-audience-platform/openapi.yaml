            - microbatch
        status:
          type: string
          enum:
            - completed
            - failed
        input_record_count:
          type: integer
        match_count:
          type: integer
        match_rate:
          type: number
          format: float
        amount_charged:
          type: number
          format: float
          description: Conservative USD estimate accepted for billing; not a finalized
            invoice total.
        field_list:
          type: array
          items:
            type: string
        created_at:
          type:
            - string
            - "null"
