openapi: 3.1.0
info:
  title: Infinite Audience API
  version: 1.0.0
  license:
    name: Proprietary — All Rights Reserved
    url: https://infiniteaudience.ai/terms
  description: >
    The primary REST API for Infinite Audience.

    **Authentication:** All protected endpoints require a Bearer token in the
    `Authorization` header (`Authorization: Bearer <access_token>`). Obtain an
    access token by posting your API key to `POST /v1/auth/token`.

    **API Key Scopes:** API keys can be restricted to specific scopes. If a
    token lacks the required scope for an endpoint, a `403 Forbidden` response
    is returned with a `SCOPE_REQUIRED` error code. - `discovery` — Read-only
    access to count, lookup, segments, demographics, catalogs, and status
    polling. - `purchase` — Read-write access to create/update segments and
    audiences, link campaigns, and execute purchases/deliveries. - `account` —
    Full access to self-service API key management, webhook settings, delivery
    destinations, and billing details.
servers:
  - url: https://api.infiniteaudience.ai
    description: Production API Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Bearer access token obtained from POST /v1/auth/token. Include in all
        protected requests as: Authorization: Bearer <access_token>
  schemas:
    CostEstimate:
      type: object
      required:
        - base_cost
        - match_cost
        - field_cost
        - destination_cost
        - total_cost
        - unit_price
        - billing_count
      properties:
        base_cost:
          type: number
          description: Base audience-delivery cost.
        match_cost:
          type: number
          description: One-time deferred file-match cost included only until the
            underlying run is first delivered.
        field_cost:
          type: number
          description: Total surcharge for requested attributes.
        destination_cost:
          type: number
          description: Destination surcharge (0 for download).
        total_cost:
          type: number
          description: Sum of all cost components.
        unit_price:
          type: number
          description: Effective cost per record.
        billing_count:
          type: integer
          description: Number of records that will be billed.
    LicensePricing:
      type: object
      required:
        - status
        - evaluated_at
        - already_licensed_count
      properties:
        status:
          type: string
          enum:
            - live
            - cached
            - unavailable
          description: >
            Whether cost_estimate reflects a freshly-computed license split
            (live), a recent cached one (cached, still authoritative — only the
            underlying counts are reused, dollars are always recomputed from
            current rates), or could not be determined in time (unavailable —
            cost_estimate equals max_cost_estimate exactly in this case, so no
            consumer sees a misleading number).
        evaluated_at:
          type:
            - string
            - "null"
          format: date-time
          description: >
            When the license split backing cost_estimate was computed. For a
            cached split this is the ORIGINAL computation time, not now — use it
            to judge staleness. Null when status is unavailable.
        already_licensed_count:
          type:
            - integer
            - "null"
          description: >
            How many of this audience's candidate identities already hold an
            active license elsewhere and were therefore excluded from
            cost_estimate's billable count. Null when status is unavailable.
    IntegrationRunCounts:
      type: object
      additionalProperties: false
      required:
        - input
        - matched
        - delivered
        - applied
        - unchanged
        - skipped
        - failed
      properties:
        input:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
        delivered:
          type: integer
          minimum: 0
        applied:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    IntegrationRun:
      type: object
      additionalProperties: false
      required:
        - run_id
        - provider
        - connection_id
        - connection_display_name
        - kind
        - data_flow
        - purpose
        - status
        - billing_source
        - customer_boundary
        - counts
        - selected_fields
        - boundary_at
        - failure_code
        - failure_message
        - created_at
        - updated_at
        - completed_at
      properties:
        run_id:
          type: string
        provider:
          type: string
        connection_id:
          type: string
        connection_display_name:
          type:
            - string
            - "null"
        kind:
          type: string
          enum:
            - batch_enrichment
            - file_enrichment
            - ingest
            - activation
            - export
        data_flow:
          type: string
          enum:
            - provider_to_platform
            - platform_to_provider
            - round_trip
        purpose:
          type: string
          enum:
            - enrichment
            - ingest
            - activation
            - export
        status:
          type: string
          enum:
            - created
            - processing
            - awaiting_boundary
            - settling
            - completed
            - failed
            - cancelled
        billing_source:
          type: string
          enum:
            - native
            - shopify
        customer_boundary:
          type: string
          enum:
            - api_response
            - file_available
            - destination_handoff
            - provider_writeback
        counts:
          $ref: "#/components/schemas/IntegrationRunCounts"
        selected_fields:
          type: array
          items:
            type: string
        boundary_at:
          type:
            - string
            - "null"
          format: date-time
        failure_code:
          type:
            - string
            - "null"
        failure_message:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
    IntegrationRunListResponse:
      type: object
      additionalProperties: false
      required:
        - runs
        - has_more
        - next_cursor
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/IntegrationRun"
        has_more:
          type: boolean
        next_cursor:
          type:
            - string
            - "null"
    IntegrationMatchCollection:
      type: object
      required:
        - collection_id
        - org_id
        - name
        - kind
        - status
        - retention_days
        - unique_identity_count
        - count_refreshed_at
        - last_captured_at
        - created_at
        - updated_at
      properties:
        collection_id:
          type: string
        org_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - default
        status:
          type: string
          enum:
            - active
            - paused
        retention_days:
          type: integer
          enum:
            - 90
        unique_identity_count:
          type:
            - integer
            - "null"
          minimum: 0
        count_refreshed_at:
          type:
            - string
            - "null"
          format: date-time
        last_captured_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntegrationCollectionFilter:
      type: object
      required: []
      additionalProperties: false
      properties:
        providers:
          type: array
          maxItems: 20
          items:
            type: string
        connection_ids:
          type: array
          maxItems: 100
          items:
            type: string
        integration_run_ids:
          type: array
          maxItems: 100
          items:
            type: string
        source_kinds:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
              - recurring
              - batch
              - file
        boundary_at_from:
          type: string
          format: date-time
        boundary_at_to:
          type: string
          format: date-time
    IntegrationMaterializationPreview:
      type: object
      required:
        - source_observations
        - unique_identities
        - duplicate_observations
        - expired_identities
        - suppressed_identities
        - already_present
        - net_additions
      properties:
        source_observations:
          type: integer
          minimum: 0
        unique_identities:
          type: integer
          minimum: 0
        duplicate_observations:
          type: integer
          minimum: 0
        expired_identities:
          type: integer
          minimum: 0
        suppressed_identities:
          type: integer
          minimum: 0
        already_present:
          type: integer
          minimum: 0
        net_additions:
          type: integer
          minimum: 0
    IntegrationMaterializationPreviewRequest:
      type: object
      required: []
      additionalProperties: false
      properties:
        filters:
          $ref: "#/components/schemas/IntegrationCollectionFilter"
        target_segment_id:
          type: string
    IntegrationMaterializationPreviewResponse:
      type: object
      required:
        - cutoff_at
        - preview
      properties:
        cutoff_at:
          type: string
          format: date-time
        preview:
          $ref: "#/components/schemas/IntegrationMaterializationPreview"
    IntegrationMaterializationRequest:
      type: object
      required:
        - mode
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - new_segment
            - add_to_segment
        segment_name:
          type: string
          minLength: 1
          maxLength: 120
        target_segment_id:
          type: string
        filters:
          $ref: "#/components/schemas/IntegrationCollectionFilter"
    IntegrationMaterialization:
      type: object
      required:
        - materialization_id
        - collection_id
        - mode
        - status
        - filters
        - source_cutoff_at
        - target_segment_id
        - target_segment_name
        - target_segment_version
        - preview
        - identity_count
        - match_levels
        - failure_code
        - failure_message
        - created_at
        - updated_at
        - completed_at
      properties:
        materialization_id:
          type: string
        collection_id:
          type: string
        mode:
          type: string
          enum:
            - new_segment
            - add_to_segment
        status:
          type: string
          enum:
            - created
            - processing
            - completed
            - failed
        filters:
          $ref: "#/components/schemas/IntegrationCollectionFilter"
        source_cutoff_at:
          type: string
          format: date-time
        target_segment_id:
          type: string
        target_segment_name:
          type:
            - string
            - "null"
        target_segment_version:
          type:
            - integer
            - "null"
          minimum: 1
        preview:
          oneOf:
            - $ref: "#/components/schemas/IntegrationMaterializationPreview"
            - type: "null"
        identity_count:
          type:
            - integer
            - "null"
          minimum: 0
        match_levels:
          type: array
          items:
            type: string
            enum:
              - I
              - H
              - D
              - S
              - A
        failure_code:
          type:
            - string
            - "null"
        failure_message:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
    BillingReadinessProjection:
      type: object
      required:
        - requires_card
        - has_default_card
        - collection_method_ok
        - payment_collection_ready
        - status
      properties:
        requires_card:
          type: boolean
        has_default_card:
          type: boolean
        collection_method_ok:
          type: boolean
        payment_collection_ready:
          type: boolean
        status:
          type: string
          enum:
            - ok
            - card_missing
            - collection_method_mismatch
            - not_applicable
    BillingUsageRateProjection:
      type: object
      required:
        - match
        - audience_delivery
        - destination
        - enrichment_field
      properties:
        match:
          type: object
          required:
            - microbatch
            - file
          properties:
            microbatch:
              type: integer
              minimum: 0
            file:
              type: integer
              minimum: 0
        audience_delivery:
          type: object
          required:
            - filter
            - matched
            - similarity
            - propensity
          properties:
            filter:
              type: integer
              minimum: 0
            matched:
              type: integer
              minimum: 0
            similarity:
              type: integer
              minimum: 0
            propensity:
              type: integer
              minimum: 0
        destination:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        enrichment_field:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    BillingContractProjection:
      type: object
      required:
        - tier
        - cadence
        - commitment_term_months
        - commitment_amount_cents
        - usage_discount_bps
        - contract_start_at
        - contract_end_at
        - current_period_start_at
        - current_period_end_at
        - pending_change_at
        - scheduled_change
        - usage_rates
      properties:
        tier:
          type:
            - string
            - "null"
          enum:
            - paygo
            - starter
            - growth
            - enterprise
            - null
        cadence:
          type:
            - string
            - "null"
          enum:
            - monthly
            - annual
            - null
        commitment_term_months:
          type: integer
          enum:
            - 0
            - 12
            - 24
            - 36
        commitment_amount_cents:
          type: integer
          minimum: 0
        usage_discount_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Contract discount applied to usage rates only; commitment charges
            and minimums are unchanged.
        contract_start_at:
          type:
            - string
            - "null"
          format: date-time
        contract_end_at:
          type:
            - string
            - "null"
          format: date-time
        current_period_start_at:
          type:
            - string
            - "null"
          format: date-time
        current_period_end_at:
          type:
            - string
            - "null"
          format: date-time
        pending_change_at:
          type:
            - string
            - "null"
          format: date-time
        scheduled_change:
          oneOf:
            - $ref: "#/components/schemas/BillingScheduledContractChange"
            - type: "null"
        usage_rates:
          oneOf:
            - $ref: "#/components/schemas/BillingUsageRateProjection"
            - type: "null"
    BillingScheduledContractChange:
      type: object
      required:
        - kind
        - request_id
        - status
        - effective_at
        - previous_contract_end_at
        - successor_contract_id
        - terms
        - error_code
        - created_at
        - updated_at
      properties:
        kind:
          type: string
          enum:
            - replacement
            - renewal
            - cancellation
        request_id:
          type: string
        status:
          type: string
          enum:
            - provisioning
            - scheduled
            - failed
        effective_at:
          type: string
          format: date-time
        previous_contract_end_at:
          type:
            - string
            - "null"
          format: date-time
        successor_contract_id:
          type:
            - string
            - "null"
        terms:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - tier
                - cadence
                - commitment_term_months
                - commitment_amount_cents
                - usage_discount_bps
                - usage_rates
              properties:
                tier:
                  type: string
                  enum:
                    - paygo
                    - starter
                    - growth
                    - enterprise
                cadence:
                  type: string
                  enum:
                    - monthly
                    - annual
                commitment_term_months:
                  type: integer
                  enum:
                    - 0
                    - 12
                    - 24
                    - 36
                commitment_amount_cents:
                  type: integer
                  minimum: 0
                usage_discount_bps:
                  type: integer
                  minimum: 0
                  maximum: 10000
                usage_rates:
                  $ref: "#/components/schemas/BillingUsageRateProjection"
            - type: "null"
        error_code:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BillingMoneyProjection:
      type: object
      required:
        - available_balance_cents
        - committed_balance_cents
        - promotional_balance_cents
        - current_period_spend_cents
        - current_invoice_total_cents
        - next_credit_expiry_at
        - active_reserved_cents
        - accepted_pending_cents
        - effective_available_cents
      properties:
        available_balance_cents:
          type:
            - integer
            - "null"
        committed_balance_cents:
          type:
            - integer
            - "null"
        promotional_balance_cents:
          type:
            - integer
            - "null"
        current_period_spend_cents:
          type: integer
          minimum: 0
        current_invoice_total_cents:
          type:
            - integer
            - "null"
        next_credit_expiry_at:
          type:
            - string
            - "null"
          format: date-time
        active_reserved_cents:
          type: integer
          minimum: 0
        accepted_pending_cents:
          type: integer
          minimum: 0
        effective_available_cents:
          type:
            - integer
            - "null"
    BillingSnapshot:
      type: object
      required:
        - billing_account_id
        - owner_type
        - owner_id
        - source
        - consumer_org_id
        - billing_authority
        - agency_id
        - consumer_postpay_ceiling_cents
        - consumer_money
        - billing_model
        - collection_method
        - currency
        - status
        - contract
        - money
        - payment_method_ready
        - auto_recharge
        - latest_invoice
        - collection
        - projection
      properties:
        billing_account_id:
          type: string
        owner_type:
          type: string
          enum:
            - org
            - agency
        owner_id:
          type: string
        source:
          type: string
        consumer_org_id:
          type: string
        billing_authority:
          type: string
          enum:
            - self
            - agency
        agency_id:
          type:
            - string
            - "null"
        consumer_postpay_ceiling_cents:
          type:
            - integer
            - "null"
        consumer_money:
          type: object
          required:
            - current_period_spend_cents
            - active_reserved_cents
            - accepted_pending_cents
            - projected_at
          properties:
            current_period_spend_cents:
              type: integer
              minimum: 0
            active_reserved_cents:
              type: integer
              minimum: 0
            accepted_pending_cents:
              type: integer
              minimum: 0
            projected_at:
              type:
                - string
                - "null"
              format: date-time
        billing_model:
          type: string
          enum:
            - prepay
            - postpay
        collection_method:
          type: string
          enum:
            - charge_automatically
            - send_invoice
        currency:
          type: string
          const: usd
        status:
          type: string
          enum:
            - pending
            - active
            - payment_action_required
            - past_due
            - suspended
            - canceled
            - provisioning_failed
        contract:
          $ref: "#/components/schemas/BillingContractProjection"
        money:
          $ref: "#/components/schemas/BillingMoneyProjection"
        payment_method_ready:
          type: boolean
        auto_recharge:
          $ref: "#/components/schemas/BillingAutoRechargeProjection"
        latest_invoice:
          type: object
          required:
            - id
            - status
          properties:
            id:
              type:
                - string
                - "null"
            status:
              type:
                - string
                - "null"
        collection:
          $ref: "#/components/schemas/BillingCollectionProjection"
        projection:
          type: object
          required:
            - projected_at
            - provider_version
          properties:
            projected_at:
              type:
                - string
                - "null"
              format: date-time
            provider_version:
              type:
                - string
                - "null"
    BillingCollectionProjection:
      type: object
      required:
        - status
        - stripe_invoice_id
        - failure_started_at
        - grace_period_ends_at
        - updated_at
      properties:
        status:
          type: string
          enum:
            - current
            - past_due
            - uncollectible
        stripe_invoice_id:
          type:
            - string
            - "null"
        failure_started_at:
          type:
            - string
            - "null"
          format: date-time
        grace_period_ends_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    BillingAutoRechargeProjection:
      type: object
      required:
        - configured
        - enabled
        - threshold_cents
        - recharge_to_cents
        - configuration_request_id
        - payment_status
        - last_payment_attempt_id
        - stripe_invoice_id
        - stripe_payment_intent_id
        - last_error_code
        - updated_at
        - pending_change
      properties:
        configured:
          type: boolean
        enabled:
          type: boolean
        threshold_cents:
          type:
            - integer
            - "null"
          minimum: 500
        recharge_to_cents:
          type:
            - integer
            - "null"
          minimum: 1500
          maximum: 5000000
        configuration_request_id:
          type:
            - string
            - "null"
        payment_status:
          type: string
          enum:
            - none
            - pending
            - action_required
            - paid
            - failed
        last_payment_attempt_id:
          type:
            - string
            - "null"
        stripe_invoice_id:
          type:
            - string
            - "null"
        stripe_payment_intent_id:
          type:
            - string
            - "null"
        last_error_code:
          type:
            - string
            - "null"
        updated_at:
          type:
            - string
            - "null"
          format: date-time
        pending_change:
          oneOf:
            - type: object
              additionalProperties: true
              required:
                - request_id
                - enabled
                - threshold_cents
                - recharge_to_cents
                - status
                - last_error_code
                - created_at
                - updated_at
              properties:
                request_id:
                  type: string
                enabled:
                  type: boolean
                threshold_cents:
                  type: integer
                  minimum: 500
                recharge_to_cents:
                  type: integer
                  minimum: 1500
                  maximum: 5000000
                status:
                  type: string
                  enum:
                    - provisioning
                    - failed
                last_error_code:
                  type:
                    - string
                    - "null"
                created_at:
                  type: string
                  format: date-time
                updated_at:
                  type: string
                  format: date-time
            - type: "null"
    AutoRechargeUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - request_id
        - enabled
        - threshold_cents
        - recharge_to_cents
      properties:
        request_id:
          type: string
          minLength: 8
          maxLength: 160
        enabled:
          type: boolean
        threshold_cents:
          type: integer
          minimum: 500
          maximum: 4999000
        recharge_to_cents:
          type: integer
          minimum: 1500
          maximum: 5000000
    AccountAutoRechargeResponse:
      type: object
      required:
        - billing_account_id
        - auto_recharge
        - action_url
      properties:
        billing_account_id:
          type: string
        auto_recharge:
          $ref: "#/components/schemas/BillingAutoRechargeProjection"
        action_url:
          type:
            - string
            - "null"
          format: uri
    AccountBillingResponse:
      type: object
      required:
        - billing
        - billing_mode
        - parent_org
        - billing_readiness
        - operational
        - projection
      properties:
        billing:
          $ref: "#/components/schemas/BillingSnapshot"
        billing_mode:
          type: string
          enum:
            - org_billed
            - parent_billed
        parent_org:
          oneOf:
            - type: object
              required:
                - id
                - name
              properties:
                id:
                  type:
                    - string
                    - "null"
                name:
                  type:
                    - string
                    - "null"
            - type: "null"
        billing_readiness:
          $ref: "#/components/schemas/BillingReadinessProjection"
        operational:
          type: object
          required:
            - frozen
            - compute_usage_pct
          properties:
            frozen:
              type: boolean
            compute_usage_pct:
              type: number
              minimum: 0
        projection:
          type: object
          required:
            - projected_at
            - provider_version
            - stale
            - refresh_error_code
