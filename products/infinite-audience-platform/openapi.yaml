                      type: object
                      required:
                        - id
                        - name
                        - linked_campaign_id
                        - status
                        - record_count
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        linked_campaign_id:
                          type:
                            - string
                            - "null"
                        status:
                          type: string
                          enum:
                            - active
                            - expired
                            - pending
                            - failed
                            - archived
